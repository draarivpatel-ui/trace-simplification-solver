"0.039999999999992486" data-y="4.2999989999999855" cx="521.6784860089645" cy="493.4281839464628" r="17.012797435903934" fill="rgba(148, 163, 184, 0.3)" stroke="black" stroke-width="0.006759617307692334"/><circle data-type="circle" data-label="" data-x="-0.4600000000000075" data-y="4.2999989999999855" cx="447.7098015050343" cy="493.4281839464628" r="17.012797435903934" fill="rgba(148, 163, 184, 0.3)" stroke="black" stroke-width="0.006759617307692334"/><circle data-type="circle" data-label="" data-x="-0.9600000000000075" data-y="4.2999989999999855" cx="373.74111700110416" cy="493.4281839464628" r="17.012797435903934" fill="rgba(148, 163, 184, 0.3)" stroke="black" stroke-width="0.006759617307692334"/><circle data-type="circle" data-label="" data-x="-1.9600000000000075" data-y="4.2999989999999855" cx="225.80374799324386" cy="493.4281839464628" r="17.012797435903934" fill="rgba(148, 163, 184, 0.3)" stroke="black" stroke-width="0.006759617307692334"/><circle data-type="circle" data-label="" data-x="-2.4600000000000075" data-y="4.299998999999986" cx="151.8350634893137" cy="493.4281839464627" r="17.012797435903934" fill="rgba(148, 163, 184, 0.3)" stroke="black" stroke-width="0.006759617307692334"/><circle data-type="circle" data-label="" data-x="-1.055" data-y="5.185" cx="359.68706694535854" cy="362.50346443713534" r="20.711231661100445" fill="rgba(255, 0, 255, 0.5)" stroke="black" stroke-width="0.006759617307692334"/><text data-type="text" data-label="OrangeCrab GND escape / simplification output" data-x="-2.5" data-y="7.3" x="145.91756872900044" y="49.61592898551089" fill="black" font-size="19.23185797102184" font-family="sans-serif" text-anchor="start" dominant-baseline="central">OrangeCrab GND escape / simplification output</text><text data-type="text" data-label="Start via: 1 / 1; top red, bottom blue" data-x="-2.5" data-y="7.1" x="145.91756872900044" y="79.20340278708295" fill="black" font-size="19.23185797102184" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Start via: 1 / 1; top red, bottom blue</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="800" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '800');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":147.9373690078603,"c":0,"e":515.7609912486512,"b":0,"d":-147.9373690078603,"f":1129.558722742891};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>